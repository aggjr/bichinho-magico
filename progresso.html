<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Progresso — Pixel Play</title>
  <style>
    :root { --ink:#2a1830; --track:#e8dce8; --fill:#ff6b9d; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Baloo 2", Nunito, system-ui, sans-serif; color: var(--ink);
      background: linear-gradient(160deg,#fff6fb,#e8f6ff 50%,#fff0e8);
      padding: 24px;
    }
    .card {
      width: min(520px, 94vw); background: rgba(255,255,255,.82);
      border-radius: 28px; padding: 28px 24px 22px;
      box-shadow: 0 16px 40px rgba(40,10,60,.14);
    }
    .eyebrow { margin: 0; font-weight: 800; letter-spacing: .04em; color: #ff6b9d; font-size: .9rem; }
    h1 { margin: 6px 0 4px; font-size: clamp(1.4rem, 4vw, 1.85rem); line-height: 1.2; }
    .sub { margin: 0 0 18px; opacity: .65; font-weight: 700; font-size: .95rem; }
    .bar {
      height: 22px; border-radius: 999px; background: var(--track);
      overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.08);
    }
    .fill {
      height: 100%; width: 0%; border-radius: inherit;
      background: linear-gradient(90deg, #ff8fab, #ff6b9d 40%, #7ec8ff);
      transition: width .45s ease;
    }
    .meta { display: flex; justify-content: space-between; margin-top: 10px; font-weight: 800; }
    .pct { color: #ff6b9d; font-size: 1.35rem; }
    ul { list-style: none; padding: 0; margin: 18px 0 0; }
    li { padding: 8px 0; border-top: 1px solid rgba(0,0,0,.06); font-weight: 700; display: flex; gap: 10px; align-items: center; }
    li::before { content: "○"; color: #bbb; font-size: 1.1rem; }
    li.done::before { content: "●"; color: #3fc7b0; }
    li.done { opacity: .75; }
    .foot { margin-top: 16px; font-size: .8rem; opacity: .5; font-weight: 700; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">BICHINHO MÁGICO</p>
    <h1 id="title">Carregando…</h1>
    <p class="sub" id="action"></p>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="meta">
      <span id="step">passo —</span>
      <span class="pct" id="pct">0%</span>
    </div>
    <ul id="list"></ul>
    <p class="foot">Atualiza só com a aba aberta · a cada 15s · <code>progress.json</code></p>
  </div>
  <script>
    async function load() {
      try {
        const r = await fetch("progress.json?t=" + Date.now());
        const d = await r.json();
        document.getElementById("title").textContent = d.title || "Trabalho";
        document.getElementById("action").textContent = d.action || "";
        document.getElementById("pct").textContent = (d.percent ?? 0) + "%";
        document.getElementById("fill").style.width = (d.percent ?? 0) + "%";
        document.getElementById("step").textContent = `passo ${d.step || "?"} / ${d.steps || "?"}`;
        document.getElementById("list").innerHTML = (d.checklist || [])
          .map((c) => `<li class="${c.done ? "done" : ""}">${c.text}</li>`)
          .join("");
      } catch (e) {
        document.getElementById("title").textContent = "Sem progress.json";
      }
    }
    load();
    setInterval(() => { if (!document.hidden) load(); }, 15000);
  </script>
</body>
</html>
